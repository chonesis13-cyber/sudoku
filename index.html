<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스도쿠(by JS)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E9EEF3;--surface:#fff;--ink:#1A2433;--muted:#64748B;--line:#C9D3DF;--box:#1A2433;
  --accent:#2F5BEA;--accent-soft:#DCE5FF;--peer:#EEF2F8;--same:#C5D4FF;--bad:#D6336C;--bad-soft:#FFE0EA;--on-accent:#fff;
  color-scheme:light;
  font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11151C;--surface:#1A2029;--ink:#E8EDF5;--muted:#8D9BB0;--line:#2E3846;--box:#8FA3C2;
    --accent:#7C9BFF;--accent-soft:#26335C;--peer:#212A36;--same:#2E3F73;--bad:#FF6B9A;--bad-soft:#4A2233;--on-accent:#11151C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151C;--surface:#1A2029;--ink:#E8EDF5;--muted:#8D9BB0;--line:#2E3846;--box:#8FA3C2;
  --accent:#7C9BFF;--accent-soft:#26335C;--peer:#212A36;--same:#2E3F73;--bad:#FF6B9A;--bad-soft:#4A2233;--on-accent:#11151C;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:inherit;-webkit-tap-highlight-color:transparent}
main{max-width:900px;margin:0 auto;padding:20px 16px 32px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:780px){main{grid-template-columns:minmax(0,540px) 1fr;align-items:start;gap:28px}}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline}
h1{margin:0;font-size:32px;font-weight:600;letter-spacing:-.02em}
#tm{font-variant-numeric:tabular-nums;font-size:28px;font-weight:600;color:var(--ink)}
#bd{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);aspect-ratio:1;width:100%;
  border:2px solid var(--box);border-radius:6px;overflow:hidden;background:var(--surface)}
#bd:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.c{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);
  color:var(--accent);font-weight:500;font-size:clamp(24px,7vw,42px);line-height:1;font-family:inherit;padding:0;cursor:pointer;
  display:grid;place-items:center;min-width:0;min-height:0}
.c.g{color:var(--ink);font-weight:600}
.c.r{border-right:2px solid var(--box)}
.c.b{border-bottom:2px solid var(--box)}
.c.p{background:var(--peer)}
.c.m{background:var(--same)}
.c.s{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.c.x{color:var(--bad);background:var(--bad-soft)}
.n{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%;
  font-size:clamp(9px,2.6vw,14px);font-weight:400;color:var(--muted)}
.n i{font-style:normal;display:grid;place-items:center}
.side{display:grid;gap:14px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
button.t{font:inherit;font-family:inherit;color:var(--ink);background:transparent;border:0;cursor:pointer;padding:10px 8px;min-height:44px}
.seg button{font-weight:500;font-size:19px;padding:12px 4px;min-height:54px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tools button{border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:19px;min-height:54px}
.tools button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
@media (min-width:780px){.pad{grid-template-columns:repeat(3,1fr);gap:8px}}
.pad button{font-weight:500;font-size:30px;line-height:1;font-family:inherit;color:var(--accent);background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:10px 0 6px;cursor:pointer;display:grid;gap:3px;place-items:center;min-height:68px}
.pad small{font-size:14px;font-weight:400;color:var(--muted)}
.pad button.off{visibility:hidden}
button.t.go{background:var(--accent);color:var(--on-accent);border-radius:10px;font-weight:600;font-size:22px;min-height:60px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#st{min-height:1.6em;margin:0;font-weight:500;font-size:20px;line-height:1.5}
#start{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#start[hidden]{display:none}
.sbox{width:100%;max-width:420px;display:grid;gap:18px;text-align:center}
.sbox h2{margin:0;font-size:36px;font-weight:600;letter-spacing:-.02em}
.sub{margin:0;font-size:20px;color:var(--muted)}
#sm{margin:0;min-height:1.6em;font-size:20px;font-weight:600}
#start .seg button{font-size:24px;min-height:76px}
button.t.ghost{border:1px solid var(--line);border-radius:10px;font-size:19px;min-height:54px;background:var(--surface)}
#win{position:fixed;inset:0;z-index:70;background:rgba(10,14,22,.6);display:grid;place-items:center;padding:24px;overflow:hidden}
#win[hidden]{display:none}
.wbox{position:relative;z-index:2;width:100%;max-width:400px;background:var(--surface);color:var(--ink);border-radius:20px;padding:28px 20px;text-align:center;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.wbox h2{margin:0;font-size:36px;font-weight:600}
#wt{margin:0;font-size:22px;line-height:1.7}
.cf{position:absolute;top:-20px;width:10px;height:16px;z-index:1;pointer-events:none;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}}
.stats{margin:0;display:flex;flex-wrap:nowrap;justify-content:space-between;gap:12px;font-size:clamp(15px,4.8vw,20px);white-space:nowrap;color:var(--ink)}
.stats b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
#bd.over{opacity:.55}
.tip{margin:0;font-size:16px;color:var(--muted);line-height:1.6}
.c.pop{animation:pop .35s ease-out}
.c.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.fx.bad{background:#D6336C}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.fx{position:fixed;z-index:50;pointer-events:none;color:#fff;font-weight:600;padding:4px 12px;border-radius:999px;font-size:22px;white-space:nowrap;animation:fly 1s ease-out forwards}
.fx.l1{background:#2F5BEA}
.fx.l2{background:#0E9F6E;font-size:26px}
.fx.l3{background:#E8590C;font-size:30px}
@keyframes fly{0%{opacity:0;transform:translate(-50%,0) scale(.7)}15%{opacity:1;transform:translate(-50%,-14px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.c.pop,.c.shake{animation:none}.fx{animation:fade 1s forwards;transform:translate(-50%,-14px)}@keyframes fade{0%,60%{opacity:1}100%{opacity:0}}}
</style>
</head>
<body>
<main>
  <header><h1>스도쿠(by JS)</h1><span id="tm" aria-label="경과 시간">00:00</span></header>
  <div id="bd" role="grid" aria-label="스도쿠 판" tabindex="0"></div>
  <div class="side">
    <div id="start" role="dialog" aria-modal="true" aria-labelledby="sh"><div class="sbox"><h2 id="sh">스도쿠(by JS)</h2><p class="sub">난이도를 선택해 주세요</p>
    <div class="seg" id="df" role="group" aria-label="난이도">
      <button class="t" data-k="easy">쉬움</button>
      <button class="t" data-k="mid">보통</button>
      <button class="t" data-k="hard">어려움</button>
      <button class="t" data-k="xhard">매우 어려움</button>
    </div>
    <p id="sm" aria-live="polite"></p><button class="t ghost" id="cx" hidden>게임으로 돌아가기</button></div></div>
    <p class="stats"><span>난이도 <b id="dn">-</b></span><span>실수 <b id="ms">0/3</b></span><span>힌트 <b id="hs">3</b></span></p>
    <div class="pad" id="pd" aria-label="숫자 입력"></div>
    <div class="tools">
      <button class="t" id="pn" aria-pressed="false">메모</button>
      <button class="t" id="er">지우기</button>
      <button class="t" id="un">되돌리기</button>
      <button class="t" id="hi">힌트</button>
    </div>
    <button class="t go" id="ng">새 게임</button>
    <p id="st" aria-live="polite"></p>
    <p class="tip">칸을 선택한 뒤 숫자를 누르세요. 키보드에서는 숫자 키로 입력하고, 화살표로 이동하며, N은 메모, Z는 되돌리기입니다.</p>
  </div>
</main>
<div id="win" role="dialog" aria-modal="true" aria-labelledby="wh" hidden><div class="wbox"><h2 id="wh">🎉 축하합니다!</h2><p id="wt"></p><button class="t go" id="wn">새 게임</button><button class="t ghost" id="wc">판 확인하기</button></div></div>
<script>
const $=s=>document.querySelector(s);
const CFG={easy:[38,0],mid:[32,1],hard:[27,1],xhard:[23,2]};
const LBL={easy:'쉬움',mid:'보통',hard:'어려움',xhard:'매우 어려움'};
let gen=false;
const U=[];for(let k=0;k<9;k++){const r=[],c=[],b=[];for(let j=0;j<9;j++){r.push(k*9+j);c.push(j*9+k);b.push(((k/3|0)*3+(j/3|0))*9+(k%3)*3+j%3)}U.push(r,c,b)}
function logic(g0,hidden){
  const g=g0.slice();let ch=true;
  while(ch){
    ch=false;
    for(let i=0;i<81;i++)if(!g[i]){
      const m=cands(g,i);
      if(!m)return false;
      if(!(m&(m-1))){g[i]=31-Math.clz32(m);ch=true}
    }
    if(hidden)for(const u of U)for(let d=1;d<=9;d++){
      let cnt=0,at=-1;
      for(const i of u){if(g[i]===d){cnt=-99;break}if(!g[i]&&(cands(g,i)>>d&1)){cnt++;at=i}}
      if(cnt===1){g[at]=d;ch=true}
    }
  }
  return g.every(v=>v);
}
function rest(g0){
  const g=g0.slice();let ch=true;
  while(ch){
    ch=false;
    for(let i=0;i<81;i++)if(!g[i]){
      const m=cands(g,i);
      if(!m)return 99;
      if(!(m&(m-1))){g[i]=31-Math.clz32(m);ch=true}
    }
    for(const u of U)for(let d=1;d<=9;d++){
      let cnt=0,at=-1;
      for(const i of u){if(g[i]===d){cnt=-99;break}if(!g[i]&&(cands(g,i)>>d&1)){cnt++;at=i}}
      if(cnt===1){g[at]=d;ch=true}
    }
  }
  return g.filter(v=>!v).length;
}
const MAXM=3,MAXH=3;
let dif='easy',sol,giv,cur,nt,sel=-1,pen=false,hist=[],sec=0,tm,done=false,over=false,hints=0,miss=0;
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const P=[...Array(81).keys()].map(i=>{const r=i/9|0,c=i%9,s=new Set(),br=r-r%3,bc=c-c%3;
  for(let k=0;k<9;k++){s.add(r*9+k);s.add(k*9+c)}
  for(let a=0;a<3;a++)for(let b=0;b<3;b++)s.add((br+a)*9+bc+b);
  s.delete(i);return s});
function cands(g,i){let m=1;for(const j of P[i])m|=1<<g[j];return ~m&0x3FE}
function solve(g,lim,rand){
  let n=0;
  (function go(){
    let best=-1,bm=0,bc=10;
    for(let i=0;i<81;i++)if(!g[i]){
      const m=cands(g,i);let c=0,x=m;while(x){c++;x&=x-1}
      if(c<bc){bc=c;best=i;bm=m;if(c<=1)break}
    }
    if(best<0){n++;return true}
    if(bc===0)return false;
    const ds=[];for(let d=1;d<=9;d++)if(bm>>d&1)ds.push(d);
    if(rand)shuffle(ds);
    for(const d of ds){g[best]=d;if(go()&&n>=lim)return true}
    g[best]=0;return false;
  })();
  return n;
}
const fmt=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function newGame(){
  $('#sm').textContent='퍼즐을 만드는 중…';
  setTimeout(()=>{
    const [target,need]=CFG[dif],t0=Date.now();let f,best,bs=-1,bsol;
    for(let a=0;a<80;a++){
      if(a%6===0){f=Array(81).fill(0);solve(f,1,true)}
      const q=f.slice();let left=81;
      for(const i of shuffle([...Array(81).keys()])){
        if(left<=target)break;
        const v=q[i];q[i]=0;
        if(solve(q.slice(),2)===1)left--;else q[i]=v;
      }
      if(need===0){best=q;bsol=f;break}
      let ok,sc;
      if(need===1){ok=!logic(q,false);sc=ok?1:0}
      else{const r=rest(q);ok=r>=20;sc=r*100-q.filter(Boolean).length}
      if(sc>bs){bs=sc;best=q;bsol=f}
      if(ok)break;
      if(Date.now()-t0>2500)break;
    }
    sol=bsol.slice();const p=best;
    giv=p.map(v=>v>0);cur=p.slice();nt=Array(81).fill(0);
    hist=[];sel=-1;hints=0;miss=0;streak=0;done=false;over=false;sec=0;
    clearInterval(tm);tm=setInterval(()=>{if(!done&&!over){sec++;$('#tm').textContent=fmt(sec)}},1000);
    $('#tm').textContent='00:00';$('#st').textContent='';render();$('#start').hidden=true;$('#sm').textContent='';gen=false;
  },20);
}
function render(){
  const sv=sel>=0?cur[sel]:0;let h='';
  for(let i=0;i<81;i++){
    const v=cur[i],r=i/9|0,c=i%9;
    let k='c';
    if(giv[i])k+=' g';
    if(c%3===2&&c<8)k+=' r';
    if(r%3===2&&r<8)k+=' b';
    if(i===sel)k+=' s';else if(sel>=0&&P[sel].has(i))k+=' p';
    if(sv&&v===sv&&i!==sel)k+=' m';
    if(v&&!giv[i]&&v!==sol[i])k+=' x';
    let t=v||'';
    if(!v&&nt[i]){t='<span class="n">';for(let d=1;d<=9;d++)t+='<i>'+(nt[i]>>d&1?d:'')+'</i>';t+='</span>'}
    h+=`<button class="${k}" data-i="${i}" role="gridcell" tabindex="-1" aria-label="${r+1}행 ${c+1}열 ${v||'빈 칸'}">${t}</button>`;
  }
  $('#bd').innerHTML=h;$('#bd').classList.toggle('over',over);
  let p='';
  for(let d=1;d<=9;d++){const rem=9-cur.filter(v=>v===d).length;
    p+=`<button data-d="${d}" class="${rem<=0?'off':''}" aria-label="${d} 입력">${d}<small>${rem}</small></button>`}
  $('#pd').innerHTML=p;
  $('#dn').textContent=LBL[dif];$('#ms').textContent=miss+'/'+MAXM;$('#hs').textContent=MAXH-hints;$('#hi').textContent='힌트 '+(MAXH-hints);
}
const snap=()=>{hist.push([cur.slice(),nt.slice()]);if(hist.length>200)hist.shift()};
function put(v){
  if(sel<0||giv[sel]||done||over)return;
  let good=false,bad=false;
  if(pen){if(cur[sel])return;snap();nt[sel]^=1<<v}
  else{
    snap();
    if(cur[sel]===v)cur[sel]=0;
    else{cur[sel]=v;nt[sel]=0;for(const j of P[sel])nt[j]&=~(1<<v);if(v!==sol[sel]){miss++;streak=0;bad=true}else good=true}
  }
  render();check();
  if(good)cheer();
  if(bad)oops();
}
let streak=0;
function cheer(){
  streak++;
  const lv=streak>=5?3:streak>=3?2:1,txt=['','Good!','Great!','Excellent!'][lv];
  const cell=document.querySelector('.c[data-i="'+sel+'"]');if(!cell)return;
  cell.classList.add('pop');
  const r=cell.getBoundingClientRect(),f=document.createElement('div');
  f.className='fx l'+lv;f.textContent=txt+(streak>=3?' ×'+streak:'');
  f.style.left=(r.left+r.width/2)+'px';f.style.top=r.top+'px';
  document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
}
function oops(){
  const cell=document.querySelector('.c[data-i="'+sel+'"]');if(!cell)return;
  cell.classList.add('shake');
  const left=MAXM-miss,r=cell.getBoundingClientRect(),f=document.createElement('div');
  f.className='fx bad';f.textContent=left>0?'Oops! 남은 기회 '+left:'Game Over';
  f.style.left=(r.left+r.width/2)+'px';f.style.top=r.top+'px';
  document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
}
function erase(){if(sel<0||giv[sel]||done||over)return;snap();cur[sel]=0;nt[sel]=0;render()}
function undo(){if(done||over||!hist.length)return;[cur,nt]=hist.pop();render()}
function hint(){
  if(done||over)return;
  if(hints>=MAXH){$('#st').textContent='힌트를 모두 사용했어요.';return}
  if(sel<0||giv[sel]||cur[sel]===sol[sel]){$('#st').textContent='힌트를 받을 빈 칸이나 틀린 칸을 먼저 선택하세요.';return}
  snap();cur[sel]=sol[sel];nt[sel]=0;hints++;render();check();
}
function celebrate(){
  const w=$('#win');w.querySelectorAll('.cf').forEach(x=>x.remove());
  const C=['#2F5BEA','#0E9F6E','#E8590C','#D6336C','#F5B700'];
  for(let i=0;i<80;i++){
    const d=document.createElement('div');d.className='cf';
    d.style.left=Math.random()*100+'%';d.style.background=C[i%5];
    d.style.animationDuration=(2.5+Math.random()*2)+'s';d.style.animationDelay=Math.random()*1.5+'s';
    w.appendChild(d);
  }
  const perfect=miss===0&&hints===0;
  $('#wt').innerHTML=`${LBL[dif]} 난이도 클리어!<br>걸린 시간 <b>${fmt(sec)}</b><br>실수 ${miss}회, 힌트 ${hints}회<br>${perfect?'실수도 힌트도 없는 완벽한 클리어예요!':'잘하셨어요!'}`;
  w.hidden=false;
}
function check(){
  if(miss>=MAXM){
    over=true;clearInterval(tm);render();
    $('#st').textContent='게임 오버! 실수가 3번 쌓였어요. 새 게임으로 다시 도전해 보세요.';return;
  }
  if(cur.every((v,i)=>v===sol[i])){
    done=true;clearInterval(tm);setTimeout(celebrate,600);
    $('#st').textContent=`완성했어요! 걸린 시간 ${fmt(sec)}, 실수 ${miss}회, 힌트 ${hints}회`;
  }else $('#st').textContent='';
}
$('#bd').addEventListener('click',e=>{const b=e.target.closest('.c');if(b){sel=+b.dataset.i;render()}});
$('#pd').addEventListener('click',e=>{const b=e.target.closest('button');if(b)put(+b.dataset.d)});
$('#df').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(gen)return;
  gen=true;dif=b.dataset.k;
  newGame();
});
$('#pn').onclick=()=>{pen=!pen;$('#pn').setAttribute('aria-pressed',pen)};
$('#er').onclick=erase;$('#un').onclick=undo;$('#hi').onclick=hint;$('#ng').onclick=()=>{$('#cx').hidden=!cur||done||over;$('#start').hidden=false};
$('#cx').onclick=()=>{$('#start').hidden=true};
$('#wn').onclick=()=>{$('#win').hidden=true;$('#cx').hidden=true;$('#start').hidden=false};
$('#wc').onclick=()=>{$('#win').hidden=true};
document.addEventListener('keydown',e=>{
  if(!$('#start').hidden||!cur)return;
  if(e.target.closest&&e.target.closest('#df,.tools,#ng,#pd')&&(e.key==='Enter'||e.key===' '))return;
  const k=e.key;
  if(/^[1-9]$/.test(k)){put(+k);return}
  if(k==='0'||k==='Backspace'||k==='Delete'){erase();return}
  if(k==='n'||k==='N'){$('#pn').click();return}
  if(k==='z'||k==='Z'){undo();return}
  const mv={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[k];
  if(mv){
    e.preventDefault();
    if(sel<0)sel=40;
    else{const r=sel/9|0,c=sel%9,nr=r+(mv===-9?-1:mv===9?1:0),nc=c+(mv===-1?-1:mv===1?1:0);
      if(nr>=0&&nr<9&&nc>=0&&nc<9)sel=nr*9+nc}
    render();
  }
});
</script>
</body>
</html>
